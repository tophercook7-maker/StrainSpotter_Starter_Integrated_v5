<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Realistic 7-Leaf Cannabis Icon -->
  <defs>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3edc81;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <g id="cannabis-leaf">
    <!-- Center stem -->
    <path d="M100 190 L100 95" stroke="#27ae60" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Center leaf (largest, most prominent) -->
    <path d="M100 95 Q98 45, 100 15 Q102 45, 100 95 Z" 
          fill="url(#leafGradient)" stroke="#1e8449" stroke-width="1.5"/>
    
    <!-- Left side leaves (3 leaves) -->
    <!-- Far left leaf -->
    <path d="M100 95 Q85 85, 70 80 Q60 75, 45 72 Q55 78, 70 85 Q85 90, 100 95 Z" 
          fill="url(#leafGradient)" stroke="#1e8449" stroke-width="1.5"/>
    
    <!-- Mid-left leaf -->
    <path d="M100 95 Q92 75, 85 65 Q78 55, 68 48 Q75 58, 85 68 Q92 78, 100 95 Z" 
          fill="url(#leafGradient)" stroke="#1e8449" stroke-width="1.5"/>
    
    <!-- Near-left leaf -->
    <path d="M100 95 Q96 70, 94 55 Q92 40, 88 28 Q92 42, 95 58 Q97 73, 100 95 Z" 
          fill="url(#leafGradient)" stroke="#1e8449" stroke-width="1.5"/>
    
    <!-- Right side leaves (3 leaves) -->
    <!-- Far right leaf -->
    <path d="M100 95 Q115 85, 130 80 Q140 75, 155 72 Q145 78, 130 85 Q115 90, 100 95 Z" 
          fill="url(#leafGradient)" stroke="#1e8449" stroke-width="1.5"/>
    
    <!-- Mid-right leaf -->
    <path d="M100 95 Q108 75, 115 65 Q122 55, 132 48 Q125 58, 115 68 Q108 78, 100 95 Z" 
          fill="url(#leafGradient)" stroke="#1e8449" stroke-width="1.5"/>
    
    <!-- Near-right leaf -->
    <path d="M100 95 Q104 70, 106 55 Q108 40, 112 28 Q108 42, 105 58 Q103 73, 100 95 Z" 
          fill="url(#leafGradient)" stroke="#1e8449" stroke-width="1.5"/>
    
    <!-- Add serrated edges detail -->
    <path d="M100 15 L98 20 L100 25 L98 30 L100 35 L98 40 L100 45 L98 50 L100 55 L98 60 L100 65 L98 70 L100 75 L98 80 L100 85 L98 90 L100 95" 
          fill="none" stroke="#1e8449" stroke-width="0.5" opacity="0.6"/>
  </g>
</svg>