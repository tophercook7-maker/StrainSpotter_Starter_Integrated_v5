<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Realistic 5-Leaf Cannabis Icon -->
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Center stem -->
    <path d="M100 195 L100 90" 
          stroke="#15803d" 
          stroke-width="4" 
          stroke-linecap="round"
          fill="none"/>
    
    <!-- Center leaf (largest) -->
    <path d="M100 90 
             C98 75, 97 60, 97 45
             C97 35, 98 25, 100 10
             C102 25, 103 35, 103 45
             C103 60, 102 75, 100 90 Z" 
          fill="url(#leafGrad)" 
          stroke="#15803d" 
          stroke-width="1.5"/>
    
    <!-- Add serrations to center leaf -->
    <path d="M97 45 L95 48 L97 52 L95 56 L97 60 L95 64 L97 68 L95 72 L97 76 L95 80 L97 84 L98 88
             M103 45 L105 48 L103 52 L105 56 L103 60 L105 64 L103 68 L105 72 L103 76 L105 80 L103 84 L102 88" 
          fill="none" 
          stroke="#15803d" 
          stroke-width="1" 
          opacity="0.6"/>
    
    <!-- Left inner leaf -->
    <path d="M100 90
             C92 82, 85 75, 80 68
             C75 62, 72 55, 70 48
             C72 55, 76 62, 82 68
             C88 75, 94 82, 100 90 Z"
          fill="url(#leafGrad)"
          stroke="#15803d"
          stroke-width="1.5"/>
    
    <!-- Add serrations to left inner -->
    <path d="M80 68 L78 70 L80 73 L78 76 L80 79 L78 82 L80 85 L82 88"
          fill="none"
          stroke="#15803d"
          stroke-width="0.8"
          opacity="0.6"/>
    
    <!-- Right inner leaf -->
    <path d="M100 90
             C108 82, 115 75, 120 68
             C125 62, 128 55, 130 48
             C128 55, 124 62, 118 68
             C112 75, 106 82, 100 90 Z"
          fill="url(#leafGrad)"
          stroke="#15803d"
          stroke-width="1.5"/>
    
    <!-- Add serrations to right inner -->
    <path d="M120 68 L122 70 L120 73 L122 76 L120 79 L122 82 L120 85 L118 88"
          fill="none"
          stroke="#15803d"
          stroke-width="0.8"
          opacity="0.6"/>
    
    <!-- Left outer leaf -->
    <path d="M100 90
             C88 85, 76 80, 65 75
             C55 70, 48 65, 40 58
             C48 65, 58 70, 68 75
             C78 80, 88 85, 100 90 Z"
          fill="url(#leafGrad)"
          stroke="#15803d"
          stroke-width="1.5"/>
    
    <!-- Add serrations to left outer -->
    <path d="M65 75 L63 77 L65 80 L63 83 L65 86 L67 89"
          fill="none"
          stroke="#15803d"
          stroke-width="0.8"
          opacity="0.6"/>
    
    <!-- Right outer leaf -->
    <path d="M100 90
             C112 85, 124 80, 135 75
             C145 70, 152 65, 160 58
             C152 65, 142 70, 132 75
             C122 80, 112 85, 100 90 Z"
          fill="url(#leafGrad)"
          stroke="#15803d"
          stroke-width="1.5"/>
    
    <!-- Add serrations to right outer -->
    <path d="M135 75 L137 77 L135 80 L137 83 L135 86 L133 89"
          fill="none"
          stroke="#15803d"
          stroke-width="0.8"
          opacity="0.6"/>
    
    <!-- Add veins to center leaf -->
    <path d="M100 10 L100 90" 
          stroke="#15803d" 
          stroke-width="1" 
          opacity="0.4"/>
    <path d="M100 30 L95 40 M100 30 L105 40
             M100 50 L94 60 M100 50 L106 60
             M100 70 L93 80 M100 70 L107 80"
          stroke="#15803d"
          stroke-width="0.8"
          opacity="0.3"
          fill="none"/>
  </g>
</svg>