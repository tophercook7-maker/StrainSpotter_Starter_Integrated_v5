<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- 7-Leaf Cannabis Icon -->
  <g id="cannabis-leaf">
    <!-- Center stem -->
    <path d="M100 180 L100 100" stroke="#2ecc71" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Center leaf (largest) -->
    <path d="M100 100 Q100 40, 100 20 Q100 40, 100 100" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
    
    <!-- Left leaves -->
    <!-- Far left leaf -->
    <path d="M100 100 Q60 80, 40 70 Q50 85, 100 100" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
    
    <!-- Mid-left leaf -->
    <path d="M100 100 Q75 70, 60 50 Q70 70, 100 100" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
    
    <!-- Near-left leaf -->
    <path d="M100 100 Q90 65, 85 40 Q90 65, 100 100" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
    
    <!-- Right leaves -->
    <!-- Far right leaf -->
    <path d="M100 100 Q140 80, 160 70 Q150 85, 100 100" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
    
    <!-- Mid-right leaf -->
    <path d="M100 100 Q125 70, 140 50 Q130 70, 100 100" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
    
    <!-- Near-right leaf -->
    <path d="M100 100 Q110 65, 115 40 Q110 65, 100 100" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  </g>
</svg>